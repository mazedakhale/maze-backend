name: Docker Build and Push

on:
  push:
    branches:
      - main  # Runs the workflow when changes are pushed to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/vendor-management:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/vendor-management:latest ${{ secrets.DOCKER_USERNAME }}/vendor-management:${{ github.sha }}

      - name: Push the image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/vendor-management:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vendor-management:${{ github.sha }}
